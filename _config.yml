title: "Junteng Liu"
name: "Junteng Liu"
description: "Junteng Liu's academic homepage"
url: "https://mybrienorom.github.io"
baseurl: "/LJT-Homepage"
repository: "mybrienorom/LJT-Homepage"

locale: "en-US"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
permalink: /:year/:month/:day/:title/

include:
  - "_pages"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

paginate: 5
paginate_path: /page:num/

collections:
  publications:
    output: true

defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: true

author:
  name: "Junteng Liu"
  bio: "First-year PhD candidate at HKUST NLP Group, supervised by Professor Junxian He. My research focuses on natural language processing and machine learning."
  email: "jliugi@connect.ust.hk"
  github: "Vicent0205"
  scholar: "tbK9jl4AAAAJ"
  twitter: "junteng88716710"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Vicent0205"
    - label: "Google Scholar"
      icon: "ai ai-google-scholar"
      url: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - label: "X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://x.com/junteng88716710"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Vicent0205"
    - label: "Google Scholar"
      icon: "ai ai-google-scholar"
      url: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - label: "X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://x.com/junteng88716710"
